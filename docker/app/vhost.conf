<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    # Няма да ползваме DocumentRoot за приложението директно,
    # ще мапнем конкретните префикси, за да запазиш /svganimator/...
    DocumentRoot /var/www

    <Directory /var/www>
        AllowOverride None
        Require all granted
    </Directory>

    # FRONTEND: /svganimator/frontend  -> /var/www/frontend
    Alias /svganimator/frontend /var/www/frontend
    <Directory /var/www/frontend>
        AllowOverride All
        Require all granted
        Options -MultiViews
    </Directory>

    # BACKEND: /svganimator/backend -> /var/www/backend
    Alias /svganimator/backend /var/www/backend
    <Directory /var/www/backend>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
