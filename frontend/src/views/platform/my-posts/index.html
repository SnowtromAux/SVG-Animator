<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Моите постове - SVG Animator</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="/svganimator/frontend/globals.css" />
  <link rel="stylesheet" href="/svganimator/frontend/src/views/platform/my-posts/styles.css" />

  <!-- Navbar styles -->
  <link rel="stylesheet" href="/svganimator/frontend/src/components/Navbar/styles.css" />

  <script src="/svganimator/frontend/src/utils/auth-guard.js" type="module"></script>
</head>
<body>
  <!-- Navbar mount point -->
  <div id="navbar-mount"></div>

  <!-- Animated Background -->
  <div class="background">
    <canvas id="particleCanvas"></canvas>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
  </div>

  <!-- Main Content -->
  <main class="dashboard-container">
    <div class="page-header">
      <div class="header-content">
        <h1 class="page-title">Моите постове</h1>
        <p class="page-subtitle">Преглед и управление на публикациите ви</p>
      </div>

      <div class="header-actions">
        <div class="search-box">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="9.16667" cy="9.16667" r="5.83333" stroke="currentColor" stroke-width="1.5"/>
            <path d="M16.6667 16.6667L13.3333 13.3333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Търсене в моите постове..." />
        </div>
      </div>
    </div>

    <div class="feed-container" id="feedContainer"></div>

    <!-- Empty -->
    <div class="feed-empty" id="feedEmpty" style="display:none;">
      Няма постове за показване
    </div>

    <!-- Loader -->
    <div class="feed-loader" id="feedLoader" style="display:none;">
      Зареждане...
    </div>

    <!-- Sentinel for infinite scroll -->
    <div id="feedSentinel" style="height: 1px;"></div>
  </main>

  <!-- ✅ Inline ConfirmationModal -->
  <div class="confirm-modal-overlay" id="confirmModalOverlay">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
      <div class="confirm-modal-header">
        <h2 class="confirm-modal-title" id="confirmModalTitle">Потвърждение</h2>
        <button class="confirm-modal-close" id="confirmModalClose" aria-label="Затвори">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="confirm-modal-body">
        <p class="confirm-modal-message" id="confirmModalMessage"></p>
      </div>

      <div class="confirm-modal-footer">
        <button class="confirm-btn confirm-btn-cancel" id="confirmModalCancel">Откажи</button>
        <button class="confirm-btn confirm-btn-danger" id="confirmModalConfirm">Изтрий</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/svganimator/frontend/src/components/Navbar/index.js" type="module"></script>
  <script type="module" src="/svganimator/frontend/src/views/platform/my-posts/index.js"></script>
</body>
</html>
