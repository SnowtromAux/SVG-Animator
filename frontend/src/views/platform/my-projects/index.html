<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моите проекти - SVG Animator</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Global / Page Styles -->
  <link rel="stylesheet" href="/svganimator/frontend/globals.css">
  <link rel="stylesheet" href="/svganimator/frontend/src/views/platform/my-projects/styles.css">

  <!-- Navbar styles -->
  <link rel="stylesheet" href="/svganimator/frontend/src/components/layout/Navbar/styles.css">

  <!-- Modals styles (components) -->
  <link rel="stylesheet" href="/svganimator/frontend/src/components/modals/InfoModal/styles.css">
  <link rel="stylesheet" href="/svganimator/frontend/src/components/modals/ConfirmationModal/styles.css">
  <link rel="stylesheet" href="/svganimator/frontend/src/components/ui/Form/styles.css">

  <script src="/svganimator/frontend/src/utils/auth-guard.js" type="module"></script>
</head>
<body>
  <!-- Navbar mount point -->
  <div id="navbar-mount"></div>

  <!-- Modals mount points -->
  <div id="info-modal-mount"></div>
  <div id="confirmation-modal-mount"></div>
  <div id="dynamic-form-modal-mount"></div>

  <!-- ✅ Конфигурация за "Нов проект" (редактираш тук опциите) -->
  <script type="application/json" id="newProjectModalConfig">
  {
    "name": "Нов проект",
    "options": [
      {
        "option_name": "Име на проект",
        "type": "string",
        "options_settings": {
          "required": true,
          "placeholder": "Напр. Анимирано лого",
          "default": ""
        }
      },
      {
        "option_name": "FPS",
        "type": "number",
        "options_settings": {
          "required": true,
          "min": 1,
          "max": 120,
          "step": 1,
          "default": 60
        }
      },
      {
        "option_name": "SVG файл",
        "type": "file",
        "options_settings": {
          "required": false,
          "allowed_extensions": ["svg"],
          "max_size_mb": 5
        }
      },
      {
        "option_name": "Шаблон",
        "type": "options",
        "options_settings": {
          "required": true,
          "choices": [
            { "label": "Празен", "value": "blank" },
            { "label": "Лого", "value": "logo" },
            { "label": "Спинер", "value": "spinner" }
          ],
          "default": "blank"
        }
      }
    ],
    "buttons": [
      { "name": "Откажи", "variant": "secondary", "action": "close" },
      {
        "name": "Създай",
        "variant": "primary",
        "action": "create",
        "storageKey": "newProjectDraft",
        "redirect": "/svganimator/frontend/platform/new-project"
      }
    ]
  }
  </script>

  <!-- Animated Background -->
  <div class="background">
    <canvas id="particleCanvas"></canvas>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
  </div>

  <!-- Main Content -->
  <main class="dashboard-container">
    <!-- Page Header -->
    <div class="page-header">
      <div class="header-content">
        <h1 class="page-title">Моите проекти</h1>
        <p class="page-subtitle">Управлявайте и редактирайте вашите SVG анимации</p>
      </div>
      <div class="header-actions">
        <div class="search-box">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="9.16667" cy="9.16667" r="5.83333" stroke="currentColor" stroke-width="1.5"/>
            <path d="M16.6667 16.6667L13.3333 13.3333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Търсене на проекти...">
        </div>
        <button class="btn-create" id="createNewBtn">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M10 4.16667V15.8333" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M4.16667 10H15.8333" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>Нов проект</span>
        </button>
      </div>
    </div>

    <!-- Projects Grid -->
    <div class="projects-grid" id="projectsGrid"></div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-icon">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
          <rect x="8" y="8" width="48" height="48" rx="8" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/>
          <path d="M32 24V40" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M24 32H40" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h3>Няма намерени проекти</h3>
      <p>Създайте първия си проект или променете критериите за търсене</p>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination">
      <button class="pagination-btn" id="prevPage" disabled>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M12.5 15L7.5 10L12.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="pagination-numbers" id="paginationNumbers"></div>
      <button class="pagination-btn" id="nextPage">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M7.5 15L12.5 10L7.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </main>

  <!-- Scripts -->
  <script src="/svganimator/frontend/src/components/layout/Navbar/index.js" type="module"></script>

  <!-- Modals (components) -->
  <script src="/svganimator/frontend/src/components/modals/InfoModal/index.js"></script>
  <script src="/svganimator/frontend/src/components/modals/ConfirmationModal/index.js"></script>
  
  <!-- UI (components) -->
  <script src="/svganimator/frontend/src/components/ui/Form/index.js"></script>

  <!-- Page script -->
  <script src="/svganimator/frontend/src/views/platform/my-projects/index.js"></script>
</body>
</html>
