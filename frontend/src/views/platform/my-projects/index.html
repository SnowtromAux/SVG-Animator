<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Моите проекти - SVG Animator</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Global / Page Styles -->
  <link rel="stylesheet" href="/w25/day3_20260211_306/6MI0800241_8MI0800229_svganimator/frontend/globals.css" />
  <link rel="stylesheet" href="/w25/day3_20260211_306/6MI0800241_8MI0800229_svganimator/frontend/src/views/platform/my-projects/styles.css" />

  <!-- Navbar styles -->
  <link rel="stylesheet" href="/w25/day3_20260211_306/6MI0800241_8MI0800229_svganimator/frontend/src/components/Navbar/styles.css" />

  <script src="/w25/day3_20260211_306/6MI0800241_8MI0800229_svganimator/frontend/src/utils/auth-guard.js" type="module"></script>
</head>
<body>
  <!-- Navbar mount point -->
  <div id="navbar-mount"></div>

  <!-- Animated Background -->
  <div class="background">
    <canvas id="particleCanvas"></canvas>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
  </div>

  <!-- Main Content -->
  <main class="dashboard-container">
    <!-- Page Header -->
    <div class="page-header">
      <div class="header-content">
        <h1 class="page-title">Моите проекти</h1>
        <p class="page-subtitle">Управлявайте и редактирайте вашите SVG анимации</p>
      </div>
      <div class="header-actions">
        <div class="search-box">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="9.16667" cy="9.16667" r="5.83333" stroke="currentColor" stroke-width="1.5"/>
            <path d="M16.6667 16.6667L13.3333 13.3333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Търсене на проекти..." />
        </div>
        <button class="btn-create" id="createNewBtn">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M10 4.16667V15.8333" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M4.16667 10H15.8333" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>Нов проект</span>
        </button>
      </div>
    </div>

    <!-- Projects Grid -->
    <div class="projects-grid" id="projectsGrid"></div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-icon">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
          <rect x="8" y="8" width="48" height="48" rx="8" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/>
          <path d="M32 24V40" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M24 32H40" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h3>Няма намерени проекти</h3>
      <p>Създайте първия си проект или променете критериите за търсене</p>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination">
      <button class="pagination-btn" id="prevPage" disabled>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M12.5 15L7.5 10L12.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="pagination-numbers" id="paginationNumbers"></div>
      <button class="pagination-btn" id="nextPage">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M7.5 15L12.5 10L7.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </main>

  <!-- Inline InfoModal -->
  <div class="info-modal-overlay" id="infoModalOverlay">
    <div class="info-modal" role="dialog" aria-modal="true" aria-labelledby="infoModalTitle">
      <div class="info-modal-header">
        <h2 class="info-modal-title" id="infoModalTitle">Информация</h2>
        <button class="info-modal-close" id="infoModalClose" aria-label="Затвори">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="info-modal-body" id="infoModalBody"></div>
    </div>
  </div>

  <!-- Inline ConfirmationModal -->
  <div class="confirm-modal-overlay" id="confirmModalOverlay">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
      <div class="confirm-modal-header">
        <h2 class="confirm-modal-title" id="confirmModalTitle">Потвърждение</h2>
        <button class="confirm-modal-close" id="confirmModalClose" aria-label="Затвори">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="confirm-modal-body">
        <p class="confirm-modal-message" id="confirmModalMessage"></p>
      </div>

      <div class="confirm-modal-footer">
        <button class="confirm-btn confirm-btn-cancel" id="confirmModalCancel">Откажи</button>
        <button class="confirm-btn confirm-btn-danger" id="confirmModalConfirm">Изтрий</button>
      </div>
    </div>
  </div>

  <!-- Inline ShareModal -->
  <div class="share-modal-overlay" id="shareModalOverlay">
    <div class="share-modal" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
      <div class="share-modal-header">
        <h2 class="share-modal-title" id="shareModalTitle">Сподели</h2>
        <button class="share-modal-close" id="shareModalClose" aria-label="Затвори">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="share-modal-body">
        <label class="share-label" for="shareDescription">Описание</label>
        <textarea
          id="shareDescription"
          class="share-textarea"
          placeholder="Напиши кратко описание за публикацията..."
          rows="4"
        ></textarea>
        <div class="share-hint" id="shareHint">Това описание ще се вижда в публикацията.</div>
      </div>

      <div class="share-modal-footer">
        <button class="share-btn" id="shareModalSubmit">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M8.333 11.667L16.667 3.333" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M13.333 3.333H16.667V6.667" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16.25 10.833V15c0 .92-.746 1.667-1.667 1.667H5.417A1.667 1.667 0 0 1 3.75 15V5.833c0-.92.746-1.666 1.667-1.666H9.583" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Сподели</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/w25/day3_20260211_306/6MI0800241_8MI0800229_svganimator/frontend/src/components/Navbar/index.js" type="module"></script>
  <script type="module" src="/w25/day3_20260211_306/6MI0800241_8MI0800229_svganimator/frontend/src/views/platform/my-projects/index.js"></script>
</body>
</html>
